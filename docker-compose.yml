# 로컬 개발용 Postgres. .env의 DATABASE_URL·DIRECT_URL을
# postgresql://postgres:postgres@localhost:5432/showdb 로 두면 된다.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: showdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
